<!-- Shared top bar, injected by main.py (render_page) into every page. -->
<style>
  .sx-bar { background: #16181d; border-bottom: 1px solid #3a3d44; font-family: "Open Sans", system-ui, sans-serif; }
  .sx-inner { max-width: 1400px; margin: 0 auto; padding: 10px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; }
  .sx-brand { color: #c8f62e; font-size: 14px; font-weight: 700; letter-spacing: .02em; text-decoration: none; }
  .sx-nav { display: flex; flex-wrap: wrap; gap: 6px; }
  .sx-nav a { padding: 6px 12px; border-radius: 6px; border: 1px solid transparent; color: #a3a5aa; font-size: 13px; text-decoration: none; }
  .sx-nav a:hover { color: #d8d9dc; border-color: #3a3d44; }
  .sx-nav a[aria-current="page"] { color: #d8d9dc; border-color: #3a3d44; background: #1c1f25; }
</style>
<div class="sx-bar" id="sx-bar">
  <div class="sx-inner">
    <a class="sx-brand" href="/board">Jugg Jobs</a>
    <nav class="sx-nav" id="sx-nav" aria-label="Main navigation"></nav>
  </div>
</div>
<script>
  (function () {
    // In the order you use them: collect links, grade what was fetched, read the board.
    var pages = [
      ["/workspace/urls", "Listing URLs"],
      ["/workspace", "Raw listings"],
      ["/board", "Job board"],
    ];
    var nav = document.getElementById("sx-nav");
    pages.forEach(function (entry) {
      var link = document.createElement("a");
      link.href = entry[0];
      link.textContent = entry[1];
      // The paste-the-HTML forms live under /workspace/raw/ and belong to "Raw listings".
      var here = location.pathname === entry[0] ||
        (entry[0] === "/workspace" && location.pathname.indexOf("/workspace/raw/") === 0);
      if (here) link.setAttribute("aria-current", "page");
      nav.appendChild(link);
    });
  })();
</script>
